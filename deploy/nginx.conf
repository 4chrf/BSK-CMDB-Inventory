# Replace cmdb.example.internal and certificate paths before installation.
server {
    listen 80;
    server_name cmdb.example.internal;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name cmdb.example.internal;
    ssl_certificate /etc/pki/tls/certs/cmdb-fullchain.pem;
    ssl_certificate_key /etc/pki/tls/private/cmdb.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
